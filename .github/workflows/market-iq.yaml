name: Market IQ

on:
  schedule:
    # English football mostly kicks off on weekends plus a midweek
    # round, and odds firm up as kickoff nears -- a daily run (same
    # cadence as Orange Line/Blue Line) keeps the page's prices
    # reasonably current without hammering the odds endpoint.
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Market IQ
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
        run: python3 market_iq.py

      - name: Copy page to docs
        run: |
          mkdir -p docs/market-iq
          cp market_iq.html docs/market-iq/index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/market-iq/
          git diff --staged --quiet || git commit -m "Update Market IQ"
          git pull --rebase -X theirs --autostash origin main
          git push
