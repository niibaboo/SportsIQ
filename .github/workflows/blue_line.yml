name: Blue Line

on:
  schedule:
    # NHL plays most days during the season, so this runs daily.
    # First-time schedule for this project; adjust freely once you see
    # how it behaves. Remember the NHL regular season starts ~early
    # October — earlier runs will just show preseason data.
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Blue Line
        # No API key needed — this uses the public NHL API, unlike
        # Match IQ / Player Stat Model which need THESTATSAPI_KEY.
        run: python3 blue_line.py

      - name: Commit and push updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/blue-line/
          git diff --staged --quiet || git commit -m "Update Blue Line predictions"
          git pull --rebase --autostash origin main
          git push
