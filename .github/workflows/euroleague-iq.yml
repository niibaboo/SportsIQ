name: EuroLeague IQ

on:
  schedule:
    # FIXED (user report, 2026-10-22 -- a full Thu EuroLeague slate,
    # Anadolu Efes/Besiktas/Bayern Munich/BC Dubai/Maccabi Tel
    # Aviv/Real Madrid/Panathinaikos/Baskonia, missing from the page):
    # this comment always said round nights run Tue-Fri, but the actual
    # cron below ran Mon/Wed/Fri -- Monday isn't even a round night by
    # this same comment's own reasoning, while Tuesday and Thursday
    # (real round nights) were never run at all. The 8-day lookahead
    # window usually papered over that (a Wed run already knows about
    # Thursday's games), but any fixture added or confirmed to the
    # schedule API AFTER the last run and BEFORE a day this cron skips
    # fell straight through with no run left to catch it before tipoff.
    # Switched to daily so a late-added or rescheduled fixture always
    # has a same-morning run to pick it up, at the cost of more calls
    # against this undocumented, keyless, no-published-rate-limit API.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run EuroLeague IQ
        # No API key needed -- uses EuroLeague's own public v2 API.
        run: python3 euroleague_iq.py

      - name: Commit and push updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Update EuroLeague IQ predictions"
          git pull --rebase -X theirs --autostash origin main
          git push
