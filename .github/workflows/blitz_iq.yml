name: Blitz IQ

on:
  schedule:
    # NFL's real game days are Thu/Sun/Mon, so this runs the morning of
    # each — no point running on days nothing kicks off. First-time
    # schedule for this project; adjust freely once you see how it behaves.
    - cron: '0 8 * * 4,0,1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Blitz IQ
        # No API key needed — this uses ESPN's public API, unlike
        # Match IQ / Player Stat Model which need THESTATSAPI_KEY.
        run: python3 nfl_model.py

      - name: Commit and push updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/blitz-iq/
          git diff --staged --quiet || git commit -m "Update Blitz IQ predictions"
          git push
