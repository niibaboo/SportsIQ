name: Match IQ Live Signals

# Run every 5 minutes — minimum GitHub Actions schedule granularity.
# The frontend then polls the generated JSON every 60s, so max staleness
# is ~5 minutes between script runs, but typically much fresher.
on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch: {}    # Allow manual trigger

# Allow the workflow to write back to the repo (for committing JSON)
permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch live signals
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
        run: python3 match_iq_live.py

      - name: Commit and push JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/match-iq-live/live_matches.json
          git diff-index --quiet HEAD || git commit -m "Live signals update $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          git push
