name: Match IQ

on:
  schedule:
    # Daily 06:00 UTC — switched from Mon/Wed/Fri now that Match IQ feeds
    # the Daily Signals scanners (Over 2.5 / BTTS / Corners), which need
    # a fresh run each day rather than every other day.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Match IQ
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
        run: python3 match_iq.py

      - name: Commit and push updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/match-iq/
          git diff --staged --quiet || git commit -m "Update Match IQ predictions"
          git pull --rebase --autostash origin main
          git push
