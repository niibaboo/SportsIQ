<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Stat Model — Football Props</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121820;
      --panel2: #161d27;
      --border: #233040;
      --text: #e8edf2;
      --sub: #8b98a8;
      --accent: #facc15;
      --green: #10b981;
      --red: #ef4444;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
      line-height: 1.6;
    }
    
    .header {
      margin-bottom: 30px;
    }
    
    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      display: inline-block;
      margin-bottom: 12px;
    }
    
    h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }
    
    .subtitle {
      color: var(--sub);
      font-size: 13px;
      margin-bottom: 20px;
    }
    
    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    
    .filter-btn {
      padding: 10px 16px;
      min-height: 44px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--sub);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.1s, border-color 0.1s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .filter-btn:hover {
      border-color: var(--accent);
    }

    .filter-btn:active {
      background: var(--panel2);
      border-color: var(--accent);
    }

    .filter-btn.active:active {
      background: var(--accent);
    }
    
    .content {
      display: grid;
      gap: 16px;
    }

    .fixture-header {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      padding: 10px 2px 2px;
      border-bottom: 1px solid var(--border);
      margin-bottom: -4px;
    }

    .fixture-header .fixture-date {
      color: var(--sub);
      font-weight: 400;
      margin-right: 8px;
    }
    
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      transition: all 0.2s;
    }
    
    .card:hover {
      background: var(--panel2);
      border-color: var(--accent);
    }
    
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    
    .player-info {
      flex: 1;
    }
    
    .player-name {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 4px;
    }
    
    .player-detail {
      font-size: 12px;
      color: var(--sub);
    }
    
    .market {
      font-weight: 600;
      color: var(--accent);
      margin-right: 12px;
    }
    
    .prob {
      font-size: 14px;
      font-weight: 700;
    }
    
    .prob.high {
      color: var(--green);
    }
    
    .prob.medium {
      color: var(--accent);
    }
    
    .prob.low {
      color: var(--red);
    }
    
    .card-body {
      display: grid;
      gap: 12px;
    }
    
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
    }
    
    .metric {
      background: var(--panel2);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 12px;
    }
    
    .metric-label {
      color: var(--sub);
      font-size: 11px;
      margin-bottom: 4px;
    }
    
    .metric-value {
      font-weight: 700;
      font-size: 14px;
    }
    
    .history {
      background: var(--panel2);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 12px;
    }
    
    .history-label {
      color: var(--sub);
      font-size: 11px;
      margin-bottom: 6px;
    }
    
    .dots {
      display: flex;
      flex-direction: row;
      gap: 4px;
      flex-wrap: wrap;
      align-items: center;
    }

    .dot {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 11px;
      flex-shrink: 0;
    }
    
    .dot.over {
      background: var(--green);
      color: #000;
    }
    
    .dot.under {
      background: var(--red);
      color: #fff;
    }
    
    .raw-data {
      color: var(--sub);
      font-size: 11px;
      margin-top: 8px;
      font-family: monospace;
    }
    
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--sub);
    }
    
    .error {
      background: var(--panel);
      border: 1px solid var(--red);
      padding: 16px;
      border-radius: 12px;
      color: var(--red);
      margin: 20px 0;
    }
    
    .footer {
      text-align: center;
      color: var(--sub);
      font-size: 11px;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .streakPanel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .streakPanel .panelTitle {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .streakPanel .panelNote {
      font-size: 11px;
      color: var(--sub);
      margin-bottom: 10px;
    }

    .streakRow {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-top: 1px solid var(--border);
      font-size: 12px;
    }

    .streakRow:first-of-type {
      border-top: none;
    }

    .streakRow .srMain b {
      font-size: 13px;
    }

    .streakRow .srSub {
      color: var(--sub);
      font-size: 11px;
    }

    .streakRow .streakValue {
      text-align: right;
    }

    .streakRow .streakValue .big {
      font-weight: 700;
      color: var(--green);
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="../" class="back-link">← Back to SportsIQ</a>
    <h1>📊 Player Stat Model</h1>
    <div class="subtitle">Football player props — shots, cards, goals+assists, tackles, fouls, goalkeeper saves</div>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All players</button>
    <button class="filter-btn" data-filter="shots">Shots</button>
    <button class="filter-btn" data-filter="cards">Cards</button>
    <button class="filter-btn" data-filter="goals_assists">Goals+Assists</button>
    <button class="filter-btn" data-filter="tackles">Tackles</button>
    <button class="filter-btn" data-filter="fouls">Fouls</button>
    <button class="filter-btn" data-filter="saves">Saves</button>
  </div>
  
  <div id="hotFormPanel"></div>
  <div id="realStreakPanel"></div>

  <div class="content" id="content">
    <div class="loading">Loading player data...</div>
  </div>
  
  <div class="footer">
    Data updated daily • Last update: <span id="timestamp">—</span>
  </div>

  <script>
    const PROP_CATEGORIES = {
      shots: ['shots_over_1.5', 'shots_over_2.5', 'sot_over_0.5', 'sot_over_1.5'],
      cards: ['to_be_carded'],
      goals_assists: ['goal_or_assist'],
      tackles: ['tackles_over_1.5', 'tackles_over_2.5'],
      fouls: ['fouls_over_1.5', 'fouls_over_2.5'],
      // Every non-goalkeeper projects at exactly 0% on both saves lines
      // (their rows have nothing to extract a save from), so this filter
      // naturally shows only goalkeepers -- same reasoning as the zero-
      // probability guard in build_legs() server-side.
      saves: ['saves_over_1.5', 'saves_over_2.5'],
    };
    
    let allPlayers = [];
    let currentFilter = 'all';
    
    async function loadData() {
      try {
        const response = await fetch('player_stats_data.json?' + Date.now());
        if (!response.ok) throw new Error('Failed to load data');
        const data = await response.json();
        
        // Update timestamp
        if (data.screener?.generated_at) {
          document.getElementById('timestamp').textContent = data.screener.generated_at;
        }
        
        allPlayers = Object.values(data.players || {});
        renderPlayers();
        setupFilters();
        renderStreakPanels(data.hot_form, data.real_streak);
      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="error">
            <strong>Error loading data:</strong> ${err.message}<br>
            Make sure player_stats_data.json exists and is properly formatted.
          </div>
        `;
      }
    }
    
    // Hot Form = plain average over the rolling window clears a line
    // (can mask a bad most recent game). Real Streak = genuinely
    // CONSECUTIVE recent games clearing a line, walking backward from
    // the most recent game. Both computed server-side in
    // player_stat_model.py (STREAK_CONFIG / build_hot_form_entries /
    // build_real_streak_entries) and saved into player_stats_data.json
    // alongside the per-player reports and builder legs -- rendered
    // here as two standing panels, independent of the filter buttons
    // above (those only affect the player card list below).
    // Readable kickoff label from an ISO date string -- used on every
    // fixture-header divider so cards/rows are easy to scan by match day.
    function formatFixtureDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) +
        ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    }

    // Buckets a list of items that each carry match_id/match_date/opponent
    // into one group per fixture, sorted by kickoff ascending -- so
    // upcoming matches render nearest-first. teamField differs by caller:
    // player reports use "team_name", Hot Form/Real Streak entries use
    // "team" (see build_hot_form_entries/build_real_streak_entries in
    // player_stat_model.py). match_id/match_date/opponent are only
    // populated for picks from the daily fixture scan -- watchlist/manual
    // lookups carry none of them, so those items fall into a trailing
    // "no fixture" bucket instead of being dropped.
    function groupByFixture(items, teamField) {
      const groups = new Map();
      const noFixture = [];
      items.forEach(item => {
        if (!item.match_id) {
          noFixture.push(item);
          return;
        }
        if (!groups.has(item.match_id)) {
          groups.set(item.match_id, {
            match_id: item.match_id,
            match_date: item.match_date,
            label: item.opponent ? `${item[teamField] || ''} vs ${item.opponent}` : (item[teamField] || ''),
            items: [],
          });
        }
        groups.get(item.match_id).items.push(item);
      });
      const fixtures = Array.from(groups.values()).sort((a, b) => {
        if (!a.match_date) return 1;
        if (!b.match_date) return -1;
        return new Date(a.match_date) - new Date(b.match_date);
      });
      return { fixtures, noFixture };
    }

    function renderStreakPanels(hotForm, realStreak) {
      const hf = hotForm || [];
      const rs = realStreak || [];
      const hfPanel = document.getElementById('hotFormPanel');
      const rsPanel = document.getElementById('realStreakPanel');

      const renderHfRow = e => `
        <div class="streakRow">
          <div class="srMain"><b>${e.player}</b><br><span class="srSub">${e.team} · ${e.league} · ${e.label}</span></div>
          <div class="streakValue"><span class="big">${e.avg} avg</span><br><span class="srSub">${e.n_games}gm · ${e.history}</span></div>
        </div>
      `;
      const renderRsRow = e => `
        <div class="streakRow">
          <div class="srMain"><b>${e.player}</b><br><span class="srSub">${e.team} · ${e.league} · ${e.label}</span></div>
          <div class="streakValue"><span class="big">${e.streak}+ straight</span><br><span class="srSub">${e.history}</span></div>
        </div>
      `;

      // Each panel's entries are already sorted (avg desc / streak desc)
      // coming in from the backend; grouping by fixture preserves that
      // relative order within each group (Map insertion order), so only
      // the fixture groups themselves need their own date sort.
      function renderGrouped(entries, rowFn) {
        const { fixtures, noFixture } = groupByFixture(entries, 'team');
        let out = fixtures.map(g => `
          <div class="fixture-header">${g.match_date ? `<span class="fixture-date">${formatFixtureDate(g.match_date)}</span>` : ''}${g.label}</div>
          ${g.items.map(rowFn).join('')}
        `).join('');
        if (noFixture.length) {
          out += `
            <div class="fixture-header">Other (no upcoming fixture)</div>
            ${noFixture.map(rowFn).join('')}
          `;
        }
        return out;
      }

      hfPanel.innerHTML = !hf.length ? '' : `
        <div class="streakPanel">
          <div class="panelTitle">📊 Hot Form</div>
          <div class="panelNote">Average over the player's recent games clears the line — can mask a bad most recent game. Not a streak.</div>
          ${renderGrouped(hf, renderHfRow)}
        </div>
      `;

      rsPanel.innerHTML = !rs.length ? '' : `
        <div class="streakPanel">
          <div class="panelTitle">🔥 Real Streak</div>
          <div class="panelNote">Genuinely CONSECUTIVE recent games clearing the line, walking backward from the most recent game.</div>
          ${renderGrouped(rs, renderRsRow)}
        </div>
      `;
    }

    function setupFilters() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.filter;
          renderPlayers();
        });
      });
    }
    
    function shouldShowPlayer(player, filter) {
      if (filter === 'all') return true;
      
      const categories = PROP_CATEGORIES[filter] || [];
      return categories.some(cat => player.props?.[cat] > 0);
    }
    
    function getProbClass(prob) {
      if (prob >= 0.65) return 'high';
      if (prob >= 0.55) return 'medium';
      return 'low';
    }
    
    function formatHistory(gameLog, line) {
      if (!gameLog || !gameLog[0]) return '—';
      return gameLog.map(v => v > line ? `<span class="dot over">${v}</span>` : `<span class="dot under">${v}</span>`).join('');
    }
    
    function renderPlayers() {
      const filtered = allPlayers.filter(p => shouldShowPlayer(p, currentFilter));

      if (filtered.length === 0) {
        document.getElementById('content').innerHTML = '<div class="loading">No players found for this filter.</div>';
        return;
      }

      // Sort by highest probability
      const byMaxProb = (a, b) => {
        const aMax = Math.max(...Object.values(a.props || {}));
        const bMax = Math.max(...Object.values(b.props || {}));
        return bMax - aMax;
      };

      // Group by fixture (match_id) so cards for the same upcoming match
      // sit together, nearest kickoff first. Players with no match_id --
      // watchlist/manual lookups, which don't carry fixture data -- fall
      // into a trailing "no fixture" bucket, sorted the old way.
      const { fixtures, noFixture } = groupByFixture(filtered, 'team_name');
      fixtures.forEach(g => g.items.sort(byMaxProb));
      noFixture.sort(byMaxProb);

      const renderCard = player => {
        const gameLog = player.game_log || {};
        const hitRates = player.hit_rates || {};
        
        return `
          <div class="card">
            <div class="card-header">
              <div class="player-info">
                <div class="player-name">${player.player_name}</div>
                <div class="player-detail">${player.team_name} • ${player.league_name}</div>
              </div>
              <div>
                <span class="market">${player.rolling_matches_used} games used</span>
              </div>
            </div>
            
            <div class="card-body">
              ${player.low_data ? '<div class="error">⚠ Low data: Probabilities may be unreliable</div>' : ''}
              
              ${Object.entries(player.props || {})
                .filter(([k, v]) => v > 0)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 3)
                .map(([prop, prob]) => {
                  const hr = hitRates[prop];
                  const probClass = getProbClass(prob);
                  return `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border);">
                      <span style="font-size: 13px; color: var(--sub);">${prop.replace(/_/g, ' ')}</span>
                      <span class="prob ${probClass}">${(prob * 100).toFixed(0)}%</span>
                      ${hr ? `<span style="font-size: 11px; color: var(--sub);">${hr.hits}/${hr.total}</span>` : ''}
                    </div>
                  `;
                }).join('')}
              
              ${gameLog && Object.keys(gameLog).length > 0 ? `
                <div class="history">
                  ${gameLog.shots ? `
                    <div class="history-label">Shots — last ${gameLog.shots.length} games</div>
                    <div class="dots">${gameLog.shots.map((v, i) => `<span class="dot ${v > 2 ? 'over' : 'under'}" title="Match ${i+1}">${v}</span>`).join('')}</div>
                  ` : ''}
                  ${gameLog.shots_on_target ? `
                    <div class="history-label" style="margin-top:10px">Shots on Target — last ${gameLog.shots_on_target.length} games</div>
                    <div class="dots">${gameLog.shots_on_target.map((v, i) => `<span class="dot ${v > 0 ? 'over' : 'under'}" title="Match ${i+1}">${v}</span>`).join('')}</div>
                  ` : ''}
                  ${gameLog.saves && gameLog.saves.some(v => v > 0) ? `
                    <div class="history-label" style="margin-top:10px">Saves — last ${gameLog.saves.length} games</div>
                    <div class="dots">${gameLog.saves.map((v, i) => `<span class="dot ${v > 1 ? 'over' : 'under'}" title="Match ${i+1}">${v}</span>`).join('')}</div>
                  ` : ''}
                  <div class="raw-data">${player.rolling_form_summary || '—'}</div>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      };

      let html = fixtures.map(g => `
        <div class="fixture-header">${g.match_date ? `<span class="fixture-date">${formatFixtureDate(g.match_date)}</span>` : ''}${g.label}</div>
        ${g.items.map(renderCard).join('')}
      `).join('');

      if (noFixture.length) {
        html += `
          <div class="fixture-header">Other players (no upcoming fixture)</div>
          ${noFixture.map(renderCard).join('')}
        `;
      }

      document.getElementById('content').innerHTML = html;
    }
    
    // Load data on page load
    loadData();
  </script>
</body>
</html>
